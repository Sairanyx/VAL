services:
  train:
    build: .
    volumes: ["./app:/app/app", "./data:/app/data", "./runs:/app/runs"]
    # GPU access (needs nvidia-container-toolkit on the host)
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  # Runs on the local server only, so plant data stays on site.
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-copilot}
      POSTGRES_DB: copilot
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db_data:
