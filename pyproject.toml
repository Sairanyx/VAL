[project]
name = "sinceai-hackathon"
version = "0.1.0"
description = "Since AI Hackathon 2026 project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # LLM APIs
    "anthropic>=0.40",
    "openai>=1.50",
    # data basics
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.10",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "pre-commit>=4", "ipykernel>=6"]
ui = ["streamlit>=1.40"]
ml = [
    # GPU PyTorch (NVIDIA, CUDA 13.2) on Linux + Windows.
    # LUMI (AMD GPUs) does NOT use this: it uses LUMI's container, see lumi/README.md
    "torch>=2.15",
    "torchvision>=0.29",
    # models + training
    "transformers>=4.46",
    "sentence-transformers>=3.3",
    "accelerate>=1.1",
    "datasets>=3.1",
    "evaluate>=0.4",
    "peft>=0.13",          # LoRA: fine-tune big models cheaply
    "timm>=1.0",           # image models (ResNet, EfficientNet, ViT, ...)
    "tensorboard>=2.18",   # training curves
]

[tool.uv]
default-groups = ["dev", "ui", "ml"]   # plain `uv sync` installs everything
# Lock only for Linux + Windows on x86_64 (nobody on the team uses a Mac)
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
