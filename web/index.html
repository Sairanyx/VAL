<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Plant Room Viewer</title>
  <link rel="stylesheet" href="style.css">
  <!-- Everything is served locally: the demo must run with no internet. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="labels"></div>
  <div id="crosshair"></div>

  <div id="hud">
    <div id="status">Loading scene...</div>
    <div id="stats"></div>
    <div id="in-view"></div>
  </div>

  <div id="joystick" aria-label="Move"><div></div></div>

  <div id="buttons">
    <button id="go-fault" hidden>Go to P-005</button>
    <button id="follow" hidden>Walk route</button>
    <button id="clear-route" hidden>Clear route</button>
    <button id="profile" hidden>Person</button>
    <button id="phone">Phone</button>
    <button id="mode">Walk</button>
    <button id="boxes">Boxes on</button>
    <button id="reset">Start</button>
    <button id="view-mode">Scan</button>
    <button id="apart">Apart</button>
    <button id="reset-moves">Undo moves</button>
  </div>

  <div id="info" hidden>
    <button id="info-close" aria-label="Close">&times;</button>
    <div id="info-body"></div>
    <button id="route-here" hidden>Route here</button>
    <button id="move" hidden>Move on floor</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
