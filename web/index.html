<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Plant Room Viewer</title>
  <link rel="stylesheet" href="style.css">
  <!-- Everything is served locally: the demo must run with no internet. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "@sparkjsdev/spark": "./vendor/spark/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="labels"></div>
  <div id="crosshair"></div>

  <div id="hud">
    <div id="status">Loading scene...</div>
    <div id="stats"></div>
    <div id="in-view"></div>
  </div>

  <div id="joystick" aria-label="Move"><div></div></div>

  <div id="buttons">
    <button id="go-fault" hidden>Go to P-005</button>
    <button id="open-copilot">Copilot</button>
    <button id="add-object">Add object</button>
    <button id="follow" hidden>Walk route</button>
    <button id="clear-route" hidden>Clear route</button>
    <button id="profile" hidden>Person</button>
    <button id="phone">Phone</button>
    <button id="mode">Walk</button>
    <button id="boxes">Boxes on</button>
    <button id="range">Range 3 m</button>
    <button id="reset">Start</button>
    <button id="view-mode">Scan</button>
    <button id="apart">Apart</button>
    <button id="reset-moves">Undo changes</button>
  </div>

  <div id="info" hidden>
    <button id="info-close" aria-label="Close">&times;</button>
    <div id="info-body"></div>
    <p id="info-condition"></p>
    <button id="ask" hidden>Ask copilot</button>
    <button id="route-here" hidden>Route here</button>
    <div id="move-actions" class="action-row" hidden>
      <button id="move">Move on floor</button>
      <button id="rotate">Rotate on floor</button>
    </div>
    <p id="cant-move" hidden></p>
  </div>

  <div id="manip-bar" hidden>
    <span id="manip-title">Manipulate</span>
    <button id="manip-mode-move" class="active">Move</button>
    <button id="manip-mode-rotate">Rotate</button>
    <button id="manip-turn-left" title="Turn 45° counter-clockwise">↶ 45°</button>
    <button id="manip-turn-right" title="Turn 45° clockwise">↷ 45°</button>
    <button id="manip-done">Done</button>
  </div>

  <div id="select-frame" hidden></div>

  <div id="add-panel" hidden>
    <h2>Add object</h2>
    <p id="add-warning"></p>
    <p id="add-notes"></p>
    <label>Type <select id="add-label"></select></label>
    <label>Can it move? <select id="add-mobility"></select></label>
    <div class="add-row">
      <button id="add-smaller">Smaller</button>
      <button id="add-bigger">Bigger</button>
    </div>
    <details>
      <summary>Config</summary>
      <pre id="add-config"></pre>
    </details>
    <div class="add-row">
      <button id="add-cancel">Cancel</button>
      <button id="add-save">Save</button>
    </div>
  </div>

  <div id="copilot" hidden>
    <button id="copilot-close" aria-label="Close">&times;</button>
    <h2>Copilot</h2>
    <form id="copilot-form">
      <input id="copilot-input" placeholder="Ask about the selected object" autocomplete="off">
      <button type="submit">Ask</button>
    </form>
    <div id="copilot-answer"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
