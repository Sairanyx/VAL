[project]
name = "sinceai-hackathon"
version = "0.1.0"
description = "Since AI Hackathon 2026 project"
requires-python = ">=3.12,<3.13"
dependencies = [
    # GPU PyTorch (NVIDIA, CUDA 13.2), for the extraction pipeline and the larger model
    "torch>=2.15",
    "torchvision>=0.29",
    # models
    "transformers>=5.22",
    "accelerate>=1.1",
    "timm>=1.0",
    # data
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary]>=3.3.8",
    "faster-whisper>=1.2.1",
    "av<16",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "ipykernel>=6",
    "pytest>=8",
    "httpx>=0.28.1",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'",
                "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
